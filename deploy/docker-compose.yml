# Dijalankan di VPS dari /opt/hopeai. Berkas .env di folder yang sama berisi:
#   APIKEY, Supabase__Url, Supabase__PublishableKey, Cors__AllowedOrigins__0
#
# HTTPS dan domain diurus nginx di VPS (reverse proxy ke 127.0.0.1:8282), karena
# VPS ini juga menjalankan backend lain. Port hanya dibuka untuk localhost supaya
# backend tidak bisa diakses langsung dari internet tanpa lewat nginx.
services:
  backend:
    image: ghcr.io/muhammadhadistrifannan/hope-ai-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      Tts__CacheDir: /data/tts
    volumes:
      - tts_cache:/data/tts
    ports:
      - "127.0.0.1:8282:8080"

volumes:
  tts_cache:
