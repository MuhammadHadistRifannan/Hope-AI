name: Backend - deploy ke Render

on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build BE/backend.csproj --configuration Release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Render membangun ulang image dari Dockerfile setelah hook dipanggil
      - name: Picu deploy di Render
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
