name: Backend - keep alive

# Render versi gratis menidurkan layanan setelah 15 menit tanpa permintaan.
# Ping tiap 10 menit menjaga backend tetap bangun.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cek /health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${{ vars.BACKEND_URL }}/health"
