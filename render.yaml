# Blueprint Render untuk backend HopeAI.
# Deploy dipicu GitHub Actions lewat deploy hook, jadi autoDeploy dimatikan.
services:
  - type: web
    name: hopeai-backend
    runtime: docker
    plan: free
    rootDir: BE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    # Hanya NAMA variabel yang ditulis di sini. Nilainya diisi di dashboard Render
    # (Environment), jangan pernah di berkas ini karena berkas ini masuk repo publik.
    envVars:
      - key: APIKEY
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__PublishableKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
